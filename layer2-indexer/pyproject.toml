[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layer2-indexer"
version = "0.1.0"
description = "Codebase Indexing Pipeline — Layer 2 of Ticket-to-PR"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Graph DB — Memgraph
    "gqlalchemy>=1.7.0",         # Memgraph OGM + Cypher client

    # Vector DB — Qdrant
    "qdrant-client>=1.12.0",

    # Task queue
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # AST Parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-css>=0.23.0",
    "tree-sitter-bash>=0.23.0",

    # Git operations
    "gitpython>=3.1.43",

    # LLM — Claude (descriptions via Haiku)
    "anthropic>=0.40.0",

    # HTTP client (Ollama embeddings)
    "httpx>=0.27.0",

    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",

    # Utilities
    "structlog>=24.4.0",         # structured logging
    "tenacity>=9.0.0",           # retries with backoff
    "pygithub>=2.4.0",           # GitHub App integration
    "cryptography>=43.0.0",      # GitHub App JWT signing
    "click>=8.1.0",              # CLI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",             # TestClient
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
indexer = "src.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
