[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-to-pr-mcp"
version = "0.1.0"
description = "MCP Server — Ticket-to-PR Pipeline"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[project.scripts]
ticket-to-pr-mcp = "mcp_server.server:mcp.run"
